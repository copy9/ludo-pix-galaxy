<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludo Pix Galaxy — Desafio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --void:#05030f; --deep:#0c0724; --violet:#7b5cff; --magenta:#ff3dcb; --cyan:#2de2ff; --gold:#ffe27a;
    --card:rgba(20,12,56,.58); --glass-brd:rgba(140,160,255,.30); --text:#eaf0ff;
    --red:#ff3d81; --green:#2bffb0; --yellow:#ffc94d; --blue:#4d8bff; --ok:#2bffb0; --err:#ff6b8b;
    --display:'Orbitron','Segoe UI',system-ui,sans-serif; --body:'Exo 2','Segoe UI',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--void);}
  body{
    margin:0; min-height:100vh; font-family:var(--body); color:var(--text);
    background:
      radial-gradient(ellipse at 15% 8%, rgba(123,92,255,.38), transparent 50%),
      radial-gradient(ellipse at 88% 18%, rgba(255,61,203,.26), transparent 45%),
      radial-gradient(ellipse at 60% 95%, rgba(45,226,255,.22), transparent 50%),
      linear-gradient(180deg,#0a0624,#05030f 70%);
    display:flex; flex-direction:column; align-items:center; padding:16px 12px 32px;
  }
  body::before,body::after{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; }
  body::before{
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),
      radial-gradient(1px 1px at 90px 120px,#cfe3ff,transparent),
      radial-gradient(1.5px 1.5px at 160px 60px,#ffe9c7,transparent),
      radial-gradient(1px 1px at 230px 180px,#fff,transparent),
      radial-gradient(2px 2px at 300px 90px,#b9a8ff,transparent);
    background-size:320px 220px; animation:twinkle 5s ease-in-out infinite alternate;
  }
  body::after{
    background-image:
      radial-gradient(1px 1px at 60px 40px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 210px 150px,#9fe9ff,transparent),
      radial-gradient(1px 1px at 380px 260px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 120px 300px,#ffc0ee,transparent);
    background-size:470px 340px; animation:drift 90s linear infinite, twinkle 7s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle{ from{opacity:.45;} to{opacity:1;} }
  @keyframes drift{ from{background-position:0 0;} to{background-position:470px 340px;} }

  h1,h1.logo{
    font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:3px; text-transform:uppercase;
    text-align:center; margin:8px 0 14px; color:#fff; text-shadow:0 0 18px rgba(123,92,255,.9);
  }
  h1 span,.logo span{
    background:linear-gradient(90deg,var(--cyan),#a78bff 50%,var(--magenta)); -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent; text-shadow:none; filter:drop-shadow(0 0 10px rgba(45,226,255,.6));
  }
  .sub,.tag{ font-size:13px; opacity:.7; text-align:center; margin-bottom:18px; }

  .card,#setup{
    background:var(--card); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-brd); border-radius:24px; padding:26px 22px; width:100%; max-width:380px;
    box-shadow:0 0 0 1px rgba(45,226,255,.06), 0 24px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  }
  label{ display:block; font-size:12px; opacity:.8; margin:10px 0 4px; letter-spacing:.4px; }
  input{
    width:100%; padding:12px; border-radius:12px; font-size:15px; font-family:var(--body);
    background:rgba(255,255,255,.07); color:#fff; border:1px solid var(--glass-brd); outline:none;
  }
  input::placeholder{ color:rgba(234,240,255,.4); }
  input:focus{ border-color:var(--cyan); box-shadow:0 0 14px rgba(45,226,255,.45); }
  input[type=checkbox]{ width:auto; accent-color:var(--violet); }

  .bigbtn{
    display:block; width:100%; padding:15px; margin-top:14px; border:none; border-radius:14px; cursor:pointer;
    font-family:var(--display); font-size:13px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:#fff;
    background:linear-gradient(135deg,var(--cyan),var(--violet) 55%,#c13dff);
    box-shadow:0 0 26px rgba(123,92,255,.55), inset 0 1px 0 rgba(255,255,255,.4); transition:transform .12s, box-shadow .12s, filter .12s;
  }
  .bigbtn:hover{ filter:brightness(1.12); }
  .bigbtn:active{ transform:scale(.96); box-shadow:0 0 12px rgba(123,92,255,.5); }
  .bigbtn:disabled{ opacity:.4; cursor:not-allowed; }
  .bigbtn.ghost{ background:rgba(255,255,255,.06); border:1px solid var(--glass-brd); box-shadow:none; color:#dfe6ff; }
  .muted{ opacity:.8; font-size:13px; line-height:1.55; }
  .err{ color:var(--err); font-size:13px; min-height:16px; margin-top:8px; }
  .code{ background:rgba(255,255,255,.05); border:1px dashed var(--glass-brd); border-radius:12px; padding:12px;
    font-size:12px; word-break:break-all; margin:10px 0; text-align:center; }
  .row{ display:flex; gap:10px; }

  .tabs,.tabs2{ display:flex; gap:8px; margin-bottom:14px; }
  .tabs button,.tabs2 button{
    flex:1; padding:10px; border-radius:12px; font-weight:700; cursor:pointer; font-family:var(--body); font-size:13px;
    background:rgba(255,255,255,.05); border:1px solid var(--glass-brd); color:#fff; opacity:.65;
  }
  .tabs button.on,.tabs2 button.on{ opacity:1; background:linear-gradient(135deg,var(--cyan),var(--violet)); border-color:transparent;
    box-shadow:0 0 16px rgba(45,226,255,.45); }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:5px 13px; border-radius:999px; font-size:12px; font-weight:700;
    box-shadow:0 0 14px rgba(0,0,0,.4); }
  .badge.win{ background:linear-gradient(135deg,#2bffb0,#119b6b); color:#03281c; }
  .badge.lose{ background:linear-gradient(135deg,#ff7aa0,#d1285a); }
  .badge.wait{ background:linear-gradient(135deg,#ffe27a,#e0a63a); color:#3a2600; }
  .spinner{ width:24px; height:24px; border:3px solid rgba(255,255,255,.18); border-top-color:var(--cyan); border-radius:50%;
    animation:spin .7s linear infinite; margin:10px auto; box-shadow:0 0 12px rgba(45,226,255,.4); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #homeLink,#muteBtn{
    position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); z-index:40; color:#fff; text-decoration:none;
    background:var(--card); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--glass-brd);
    font-family:var(--body); font-size:13px; font-weight:700; border-radius:999px; cursor:pointer;
  }
  #homeLink{ left:10px; padding:8px 14px; }
  #muteBtn{ right:10px; width:34px; height:34px; font-size:15px; padding:0; }
  body{ padding-top:58px; }
  .mhero{ position:relative; width:100%; max-width:420px; height:176px; border-radius:24px; overflow:hidden; margin:0 auto 14px; cursor:pointer;
    border:1px solid var(--glass-brd); box-shadow:0 0 30px rgba(123,92,255,.4), 0 14px 30px rgba(0,0,0,.45);
    background:
      radial-gradient(1.4px 1.4px at 12% 20%,#fff,transparent), radial-gradient(1px 1px at 80% 14%,#cfe3ff,transparent),
      radial-gradient(1.2px 1.2px at 30% 60%,#ffe9c7,transparent), radial-gradient(1px 1px at 90% 50%,#fff,transparent),
      radial-gradient(1px 1px at 55% 22%,#fff,transparent), radial-gradient(1.2px 1.2px at 68% 66%,#b9a8ff,transparent),
      linear-gradient(180deg,#0a0630 0%,#1a0f5c 60%,#2b1274 100%); }
  .mhero .mneb{ position:absolute; border-radius:50%; filter:blur(30px); opacity:.5; pointer-events:none; animation:mDrift 12s ease-in-out infinite alternate; }
  .mhero .mn1{ width:150px; height:110px; left:-30px; top:10px; background:#ff3dcb; }
  .mhero .mn2{ width:160px; height:120px; right:-40px; top:30px; background:#2de2ff; animation-delay:-5s; }
  @keyframes mDrift{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(18px,-10px) scale(1.16);} }
  .mhero .morb{ position:absolute; font-size:20px; filter:drop-shadow(0 0 6px rgba(255,255,255,.7)); animation:mFloat 5s ease-in-out infinite alternate; pointer-events:none; }
  .mhero .mo1{ left:9%; top:16%; } .mhero .mo2{ right:10%; top:12%; animation-delay:-2s; font-size:17px; }
  @keyframes mFloat{ from{ transform:translateY(0) rotate(-6deg);} to{ transform:translateY(-10px) rotate(8deg);} }
  .mhero .mpad{ position:absolute; left:50%; bottom:2px; width:250px; height:40px; margin-left:-125px; border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse,rgba(143,107,255,.95),rgba(74,43,184,.55) 50%,transparent 72%); box-shadow:0 0 30px rgba(123,92,255,.6); }
  .mhero .m-stage{ position:absolute; inset:0; }
  .m-dancer{ position:absolute; inset:0; pointer-events:none; }
  .m-bubble{ position:absolute; top:8px; left:50%; transform:translateX(-50%) scale(.6); opacity:0; background:rgba(255,255,255,.96); color:#2a1660;
    padding:7px 13px; border-radius:16px; font-weight:700; font-size:12px; width:max-content; max-width:230px; text-align:center;
    box-shadow:0 8px 22px rgba(0,0,0,.4); transition:opacity .25s, transform .25s; z-index:6; pointer-events:none; }
  .m-bubble.show{ opacity:1; transform:translateX(-50%) scale(1); }
  .m-bubble::after{ content:''; position:absolute; left:50%; bottom:-6px; margin-left:-6px; width:12px; height:12px; background:inherit; transform:rotate(45deg); border-radius:3px; }
  #ctlMascot{ position:relative; width:84px; height:118px; flex-shrink:0; }
  #ctlMascot .m-bubble{ top:auto; bottom:100%; left:0; transform:scale(.6); transform-origin:bottom left; margin-bottom:6px; }
  #ctlMascot .m-bubble.show{ transform:scale(1); }
  #ctlMascot .m-bubble::after{ left:22px; }
</style>
</head>
<body>
<button id="muteBtn" title="Música">🎵</button>
<a id="homeLink" href="index.html">🏠 Início</a>
<h1>🪐 Desafio <span>Galaxy</span></h1>
<div class="sub">Desafie um amigo e conquiste a galáxia</div>
<div class="mhero" id="mhero"><div class="mneb mn1"></div><div class="mneb mn2"></div><span class="morb mo1">🌙</span><span class="morb mo2">☄️</span><div class="mpad"></div><div class="m-stage" id="mstage"></div></div>
<div class="card" id="app"><div class="spinner"></div></div>

<script src="assets/api.js"></script>
<script src="assets/sprites.js"></script>
<script src="assets/mascot.js"></script>


<script src="assets/music.js"></script>
<script>LPMusic.setup({vol:0.32,button:document.getElementById('muteBtn'),icon:true,toggle:true,persist:true});</script>

<script>
const app=document.getElementById('app');
let MM=createMascot({el:document.getElementById('mstage'),sprites:SPRM,charH:124,ground:14,stroll:true,tap:true}), lastMood='';
function mood(key,fn){ if(lastMood===key) return; lastMood=key; fn(); }

const params=new URLSearchParams(location.search);
const code=params.get('c');
const GAME_URL='jogo.html';
let me=null, stopWatching=null;

function shareLink(c){ return location.origin+location.pathname+'?c='+c; }
function html(s){ app.innerHTML=s; }
const $=id=>document.getElementById(id);

/* Mensagem de erro em texto legivel. Nunca mostramos o erro cru do servidor:
   ele pode conter detalhe interno que nao ajuda o jogador e ajuda o atacante. */
function errText(err){
  const map={
    INSUFFICIENT_FUNDS:'Saldo insuficiente. Faça um depósito na sua carteira.',
    SELF_ACCEPT:'Você não pode aceitar o próprio desafio.',
    NOT_OPEN:'Este desafio não está mais aberto.',
    EXPIRED:'Este desafio expirou e a aposta foi devolvida.',
    NOT_FOUND:'Desafio não encontrado.',
    BAD_STAKE:'Valor de aposta inválido.',
    autoexcluido:'Sua conta está em autoexclusão.',
    em_pausa:'Sua conta está em pausa.',
    OFFLINE:'Sem conexão com o servidor. Tente de novo.',
    muitas_tentativas:'Muitas tentativas. Aguarde um momento.',
  };
  return map[err && err.code] || (err && err.message) || 'Algo deu errado.';
}
function showError(err){
  html(`<p class="muted" style="color:#ffb3ab;">${LP.esc(errText(err))}</p>
        <button class="bigbtn ghost" id="againBtn">Tentar de novo</button>`);
  $('againBtn').addEventListener('click',()=>location.reload());
}

/* ------------------------------------------------------------ entrada */

async function init(){
  try{
    me = await LP.me();
  }catch(err){
    if(err.status===401){
      html(`<p class="muted">Entre na sua conta para desafiar alguém.</p>
            <a href="perfil.html" style="text-decoration:none;"><button class="bigbtn">Entrar</button></a>`);
      return;
    }
    return showError(err);
  }
  if(code) watch(code); else showCreateForm();
}

/* -------------------------------------------------------- criar desafio */

let freeMode=false;
function showCreateForm(){
  mood('create',()=>MM.react('hello','Crie seu desafio! ⚔️'));
  html(`
    <div class="tabs2">
      <button id="tabBet" class="on">💰 Com aposta</button>
      <button id="tabFree">🤝 Grátis</button>
    </div>
    <div id="betFields">
      <label>Valor da aposta</label>
      <input id="amt" type="text" inputmode="decimal" placeholder="5,00" value="5,00">
      <div class="muted" style="margin-top:6px;">Seu saldo: <b id="balTxt">${LP.fmt(me.balanceCents)}</b></div>
      <div class="muted" id="amtErr" style="margin-top:6px;color:#ffb3ab;"></div>
    </div>
    <div id="freeNote" style="display:none;" class="muted">Partida amistosa, sem dinheiro envolvido.</div>
    <button class="bigbtn" id="createBtn">Criar desafio</button>
    <a href="perfil.html#carteira" style="text-decoration:none;"><button class="bigbtn ghost">💰 Minha carteira</button></a>
  `);
  const setTab=free=>{ freeMode=free;
    $('tabFree').classList.toggle('on',free); $('tabBet').classList.toggle('on',!free);
    $('betFields').style.display=free?'none':'block';
    $('freeNote').style.display=free?'block':'none';
  };
  $('tabBet').addEventListener('click',()=>setTab(false));
  $('tabFree').addEventListener('click',()=>setTab(true));
  $('createBtn').addEventListener('click',createChallenge);
}

async function createChallenge(){
  const btn=$('createBtn');
  let stakeCents=0;
  if(!freeMode){
    stakeCents=LP.parseCents($('amt').value);
    if(stakeCents===null || stakeCents<=0){ $('amtErr').textContent='Informe um valor válido, como 5,00.'; return; }
    // Checagem local so para dar resposta rapida: quem decide de verdade e o servidor.
    if(stakeCents>me.balanceCents){ $('amtErr').textContent='Saldo insuficiente para essa aposta.'; return; }
    $('amtErr').textContent='';
  }
  btn.disabled=true; btn.textContent='Criando...';   // trava contra duplo clique
  try{
    const ch=await LP.createChallenge(stakeCents);
    history.replaceState(null,'','?c='+ch.code);
    watch(ch.code);
  }catch(err){
    btn.disabled=false; btn.textContent='Criar desafio';
    $('amtErr').textContent=errText(err);
  }
}

/* ------------------------------------------------------ acompanhar */

function watch(c){
  html('<div class="spinner"></div>');
  if(stopWatching) stopWatching();
  stopWatching=LP.watchChallenge(c, st=>render(c,st));
}

async function refreshMe(){ try{ me=await LP.me(); }catch(e){} }

function render(c, st){
  const isCreator = st.yourColor==='red' || st.isCreator;
  const inMatch = !!st.yourColor;

  if(st.status==='waiting' && isCreator) mood('wc',()=>MM.react('look','Aguardando seu amigo… 👀'));
  else if(st.status==='waiting')        mood('wo',()=>MM.react('cheer','Aceita o desafio? ⚔️'));
  else if(st.status==='both_staked')    mood('bs',()=>MM.react('cheer','Valendo! Boa sorte 🍀'));

  /* ---- esperando alguem aceitar ---- */
  if(st.status==='waiting'){
    if(isCreator){
      const betLine = st.stakeCents>0
        ? `Aposta de <b>${LP.fmt(st.stakeCents)}</b>.`
        : `Desafio <b>grátis</b>, sem aposta.`;
      html(`
        <p class="muted">Desafio criado! ${betLine} Envie o link abaixo:</p>
        <div class="code">${LP.esc(shareLink(c))}</div>
        <button class="bigbtn ghost" id="copyBtn">📋 Copiar link</button>
        <p class="muted" style="margin-top:14px;"><span class="badge wait">⏳ Aguardando</span> seu amigo aceitar...</p>
        <button class="bigbtn ghost" id="cancelBtn">Cancelar e receber a aposta de volta</button>
      `);
      $('copyBtn').addEventListener('click',async()=>{
        try{ await navigator.clipboard.writeText(shareLink(c)); $('copyBtn').textContent='✅ Copiado!'; }
        catch(e){ $('copyBtn').textContent='Copie o link acima'; }
      });
      $('cancelBtn').addEventListener('click',async()=>{
        $('cancelBtn').disabled=true;
        try{ await LP.cancelChallenge(c); await refreshMe(); location.href=location.pathname; }
        catch(err){ $('cancelBtn').disabled=false; alert(errText(err)); }
      });
    } else {
      const betLine = st.stakeCents>0 ? `valendo <b>${LP.fmt(st.stakeCents)}</b>` : `<b>amistosa, sem aposta</b>`;
      html(`
        <p class="muted">Você foi desafiado para uma partida ${betLine}.</p>
        ${st.stakeCents>0?`<div class="muted" style="margin-top:6px;">Seu saldo: <b>${LP.fmt(me.balanceCents)}</b></div>`:''}
        <button class="bigbtn" id="acceptBtn">${st.stakeCents>0?`Aceitar e apostar ${LP.fmt(st.stakeCents)}`:'Aceitar desafio'}</button>
        <div class="muted" id="accErr" style="margin-top:8px;color:#ffb3ab;"></div>
        ${st.stakeCents>0?`<a href="perfil.html#carteira" style="text-decoration:none;"><button class="bigbtn ghost">💰 Adicionar saldo</button></a>`:''}
      `);
      $('acceptBtn').addEventListener('click',async()=>{
        const b=$('acceptBtn'); b.disabled=true; b.textContent='Entrando...';
        try{ await LP.acceptChallenge(c); await refreshMe(); }
        catch(err){ b.disabled=false; b.textContent='Aceitar desafio'; $('accErr').textContent=errText(err); }
      });
    }
    return;
  }

  /* ---- partida em andamento ---- */
  if(st.status==='both_staked'){
    if(!inMatch){ html('<p class="muted">Esta partida já tem dois jogadores.</p>'); return; }
    const pot=st.stakeCents*2;
    const rakePct=(st.rakeBps/100).toFixed(0);
    const potLine = st.stakeCents>0
      ? `Os dois apostaram <b>${LP.fmt(st.stakeCents)}</b>. Pote: <b>${LP.fmt(pot)}</b> — o vencedor leva ${100-rakePct}%.`
      : `Partida amistosa, sem aposta.`;
    html(`
      <p class="muted">${potLine}</p>
      <a href="${GAME_URL}?match=${encodeURIComponent(c)}" style="text-decoration:none;">
        <button class="bigbtn">🎲 Ir para o jogo</button>
      </a>
      <p class="muted" style="margin-top:16px;">
        O resultado é apurado pelo servidor quando a partida terminar — ninguém precisa confirmar nada.
      </p>
      ${st.stakeCents>0?`<p class="muted" style="font-size:12px;">
        Se alguém abandonar a partida, ela é encerrada por inatividade: quem ficou leva o prêmio.
        Ninguém fica com a aposta presa.
      </p>`:''}
      <button class="bigbtn ghost" id="giveUpBtn">Desistir da partida</button>
    `);
    $('giveUpBtn').addEventListener('click',async()=>{
      if(!confirm('Desistir da partida? Seu adversário leva o prêmio e isso não pode ser desfeito.')) return;
      const b=$('giveUpBtn'); b.disabled=true;
      try{ await LP.forfeit(c); await refreshMe(); }
      catch(err){ b.disabled=false; alert(errText(err)); }
    });
    return;
  }

  /* ---- encerrada ---- */
  if(st.status==='resolved'){
    const iWon = st.game && st.game.winnerColor === st.yourColor;
    mood('rs'+iWon,()=>iWon?MM.react('dance','Parabéns! 🏆'):MM.react('sad','Na próxima! 💪'));
    const pot=st.stakeCents*2;
    const rake=Math.floor(pot*st.rakeBps/10000);
    const moneyLine = st.stakeCents>0
      ? `<p class="muted">Pote ${LP.fmt(pot)} · vencedor ${LP.fmt(pot-rake)} · plataforma ${LP.fmt(rake)}.</p>
         ${iWon?'<p class="muted">Já creditado na sua carteira.</p>':''}`
      : `<p class="muted">Partida amistosa — sem valores envolvidos.</p>`;
    html(`
      <p><span class="badge ${iWon?'win':'lose'}">${iWon?'🏆 Você venceu!':'Você perdeu'}</span></p>
      ${moneyLine}
      ${st.serverSeed?`<details style="margin-top:10px;"><summary class="muted" style="cursor:pointer;">Conferir que o dado foi justo</summary>
        <p class="muted" style="margin-top:8px;font-size:12px;line-height:1.6;">
          A semente desta partida era <code>${LP.esc(st.serverSeed)}</code>.
          O hash dela foi publicado antes da primeira rolagem, então ela não pôde ser trocada no meio.
          Cada dado é <code>HMAC(semente, "${LP.esc(c)}:nonce")</code> — dá para recalcular e conferir.
        </p></details>`:''}
      <a href="${location.pathname}" style="text-decoration:none;"><button class="bigbtn ghost">Novo desafio</button></a>
    `);
    refreshMe();
    return;
  }

  if(st.status==='cancelled'||st.status==='expired'){
    html(`<p class="muted">Este desafio foi ${st.status==='expired'?'expirado':'cancelado'} e a aposta foi devolvida.</p>
          <a href="${location.pathname}" style="text-decoration:none;"><button class="bigbtn ghost">Novo desafio</button></a>`);
    return;
  }
}

init();
